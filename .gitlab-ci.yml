# 应用仓库的流水线入口：逻辑在 CI 实现仓库（cicd）里，这里只做引用与钉版本。
#
# 这三处的 ref 必须是同一个 commit：换任意一处就等于换了这一版的流水线逻辑。
# 密钥不写在这里：CI/CD 变量在本仓库的 Settings → CI/CD → Variables（作用域 app-cicd）。
include:
  - project: data_ai/cicd
    ref: 69b10112bb7af1fe44167ab9c38a79c182a6dc76
    file: /templates/common.yml
  - project: data_ai/cicd
    ref: 69b10112bb7af1fe44167ab9c38a79c182a6dc76
    file: /templates/desktop-app.yml

variables:
  CI_IMPL_REF: 69b10112bb7af1fe44167ab9c38a79c182a6dc76

# 启动器（不依赖 Node 的那个 exe）只有在打 tag 时才会被真正打进发布件，
# 所以推代码时就得把「能不能编、测试过不过」验掉，别等到发版才发现。
app:launcher:
  image: golang:1.22
  stage: test
  interruptible: true
  script:
    - cd tools/launcher
    - go vet ./...
    - go test ./...
    - GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o /tmp/mastergo-transcoder.exe .
